<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entwurf – Säulen-Werkstatt</title>
<style>
  :root {
    --himmel-oben: #D9F0FF;
    --himmel-unten: #FFF3D6;
    --wiese: #7CC36B;
    --krone: #3F9E5A;
    --stamm: #8A5A3B;
    --holz: #E0B070;
    --text: #1F2937;
    --karte: #FFFFFF;
    --u: #6D28D9;
    --m: #F5B02E;
    --wasser: #3B9DF0;
    --wasser-rand: #1D6FB8;
    --primaer: #1F7A45;
    --text-leise: #4B5563;
    --karte-rand: #B7C9B0;
    --kontur: #2F4A3A;
    --rosa: #F29EB8;
    --weiss: #FFFFFF;
    --rueck-hell: #F3F8F1;
    /* neu für die Säulen-Werkstatt */
    --kaestchen: #DDD0F7;        /* Teamfarbe Unicorns, sehr hell; mit dunkler Kontur */
    --kaestchen-fuenf: #BFA9EE;  /* jedes 5. Kästchen etwas dunkler, hilft beim Zählen */
    --hand: #FFE08A;             /* aufgenommenes Kästchen, dazu Anheben und dicker Rand */
    --gitter: #D5DED2;           /* Gitterlinien, hell */
    --linie: #B4232A;            /* Ausgleichslinie, gestrichelt */
    --aus-hell: #E5E7EB;         /* deaktivierte Knöpfe */
    --einh: clamp(11px, 2vh, 22px);  /* Höhe von 1 Kästchen (1 ml) */
    --nameh: 52px;               /* Platz für Namen unter den Säulen */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, "Segoe UI", sans-serif; color: var(--text);
    background: var(--wiese); font-size: 17px; line-height: 1.35;
  }
  .szene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .seite {
    position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 14px;
    display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start;
  }
  @media (orientation: landscape) {
    .seite { grid-template-columns: 0.8fr 1.2fr; }
  }
  @media (orientation: portrait) {
    :root { --einh: clamp(11px, 1.7vh, 20px); }
  }
  .karte {
    background: var(--karte); border: 3px solid var(--kontur); border-radius: 24px;
    padding: 14px 18px; box-shadow: 0 5px 0 var(--karte-rand);
  }
  h1, h2 { margin: 0 0 6px; line-height: 1.2; }
  h1 { font-size: 1.45rem; }
  p { margin: 0 0 10px; }
  .auftrag { font-size: 1.25rem; font-weight: 600; }
  .knopfreihe { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; color: var(--text);
    min-height: 48px; min-width: 48px; padding: 8px 18px; border-radius: 16px;
    border: 3px solid var(--kontur); background: var(--karte); touch-action: manipulation;
  }
  button:focus-visible { outline: 4px solid var(--wasser-rand); outline-offset: 3px; }
  .btn-tipp { background: var(--holz); font-size: 1.3rem; min-height: 56px; padding: 10px 30px; }
  .btn-tipp[disabled] { background: var(--aus-hell); color: var(--text-leise); cursor: default; }
  .hinweis {
    display: inline-block; background: var(--karte); border: 3px solid var(--kontur);
    border-radius: 999px; padding: 2px 14px; font-weight: 700; font-size: 0.9rem; margin: 0 0 8px;
  }
  .rueck {
    background: var(--rueck-hell); border: 2px solid var(--karte-rand); border-radius: 16px;
    padding: 10px 14px; margin: 0 0 10px; font-weight: 600; min-height: 3.6em;
  }
  .zaehler {
    background: var(--karte); border: 3px solid var(--kontur); border-radius: 14px;
    padding: 6px 12px; margin: 0 0 10px; font-weight: 800;
  }
  .tipps { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 0.95rem; }
  .tipps li { background: var(--karte); border: 3px solid var(--kontur); border-radius: 14px; padding: 6px 12px; }

  /* Umschalter */
  .leiste { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 6px; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -3px; padding: 8px 14px; }
  .seg button:first-child { border-radius: 16px 0 0 16px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 16px 16px 0; }
  .seg button[aria-pressed="true"] { background: var(--primaer); color: var(--weiss); }
  .seg button[aria-pressed="true"]::before { content: "\2713\00a0"; }
  .seg button[disabled] { background: var(--aus-hell); color: var(--text-leise); cursor: default; }

  /* Koordinatensystem */
  .plot { display: grid; grid-template-columns: 46px 1fr; margin-top: 22px; }
  .achse { position: relative; height: calc(var(--einh) * 20 + var(--nameh)); }
  .achse .ml { position: absolute; top: calc(-1 * 22px); right: 4px; font-weight: 800; font-size: 0.9rem; }
  .achse span {
    position: absolute; right: 6px; transform: translateY(50%); font-weight: 700; font-size: 0.95rem;
    bottom: calc(var(--nameh) + var(--einh) * var(--v));
  }
  .feld { position: relative; height: calc(var(--einh) * 20 + var(--nameh)); }
  .gitter { position: absolute; left: 0; right: 0; top: 0; bottom: var(--nameh); pointer-events: none; }
  .gitter i { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--gitter); bottom: calc(var(--einh) * var(--v)); }
  .gitter i.null { border-top: 3px solid var(--kontur); }
  .linie {
    position: absolute; left: 0; right: 0; height: 0; border-top: 4px dashed var(--linie);
    bottom: calc(var(--nameh) + var(--einh) * var(--v)); pointer-events: none; z-index: 2;
  }
  .linie b {
    position: absolute; right: 2px; bottom: 2px; background: var(--karte); color: var(--linie);
    font-size: 0.85rem; padding: 0 6px; border-radius: 6px;
  }
  .spalten { position: absolute; inset: 0; display: flex; gap: 6px; }
  .saeule {
    position: relative; flex: 1; min-width: 44px; height: 100%; padding: 0 2px; display: flex; flex-direction: column;
    background: transparent; border: 3px solid transparent; border-radius: 12px; z-index: 1;
  }
  .saeule[aria-pressed="true"] { background: var(--rueck-hell); border: 3px dashed var(--kontur); }
  .stapel {
    height: calc(var(--einh) * 20); display: flex; flex-direction: column-reverse;
    align-items: center; justify-content: flex-start;
  }
  .k {
    flex: none; width: 72%; max-width: 70px; height: var(--einh); background: var(--kaestchen);
    border: 2px solid var(--kontur); border-radius: 3px;
  }
  .k:nth-child(5n) { background: var(--kaestchen-fuenf); }
  .k.hand { background: var(--hand); border-width: 3px; transform: translateY(-10px); }
  .name {
    height: var(--nameh); display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1rem; line-height: 1.15; margin-top: auto;
  }
  .name .tm { font-size: 1rem; }
  .name .ab { font-size: 0.8rem; font-weight: 800; border: 2px solid var(--kontur); border-radius: 6px; padding: 0 5px; background: var(--hand); }

  /* Becher-Ansicht */
  .bechers { height: calc(var(--einh) * 20 + var(--nameh)); display: flex; gap: 10px; align-items: flex-end; justify-content: space-around; padding: 0 6px; border: 3px solid var(--kontur); border-radius: 18px; background: var(--karte); }
  .becher { margin: 0; text-align: center; font-weight: 800; }
  .becher svg { display: block; width: clamp(60px, 11vw, 100px); height: auto; margin: 0 auto; }
  .becher figcaption { padding: 4px 0 6px; }

  /* Waage und Hinweise */
  .unten { min-height: 140px; margin-top: 8px; display: flex; gap: 10px; align-items: center; }
  .unten svg.waage { flex: none; height: 100px; width: auto; }
  .unten .t { margin: 0; font-weight: 600; }
  .unten .t strong { display: block; font-size: 1.1rem; }
  [hidden] { display: none !important; }

  /* Hochformat: kompakt, damit nichts scrollt (auch mit 4 Tipps) */
  @media (orientation: portrait) {
    :root { --einh: clamp(10px, 1.6vh, 18px); --nameh: 44px; }
    body { font-size: 16px; line-height: 1.3; }
    .seite { padding: 10px; gap: 10px; }
    .karte { padding: 8px 14px; }
    .hinweis { display: none; }
    h1 { font-size: 1.25rem; margin-bottom: 2px; }
    .auftrag { font-size: 1.1rem; margin-bottom: 6px; }
    .knopfreihe { margin-bottom: 6px; }
    .rueck { min-height: 2.7em; padding: 6px 12px; margin-bottom: 6px; }
    .zaehler { padding: 2px 12px; margin-bottom: 6px; }
    .btn-tipp { min-height: 48px; padding: 6px 24px; font-size: 1.15rem; }
    .tipps { grid-template-columns: 1fr 1fr; font-size: 0.82rem; margin-top: 6px; gap: 6px; }
    .tipps li { padding: 4px 8px; }
    .plot { margin-top: 20px; }
    .leiste { margin-bottom: 0; }
    .unten { min-height: 76px; margin-top: 4px; }
    .unten svg.waage { height: 170px; }
    .unten .t { font-size: 0.95rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
  <!-- Szene (nur Deko, wenige Formen) -->
  <svg class="szene" aria-hidden="true" focusable="false" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--himmel-oben)"/>
        <stop offset="1" style="stop-color:var(--himmel-unten)"/>
      </linearGradient>
      <clipPath id="becherform"><path d="M6 10 H54 L48 80 H12 Z"/></clipPath>
    </defs>
    <rect width="1200" height="800" fill="url(#himmel)"/>
    <path d="M-10 90 Q300 190 600 110 T1210 120" stroke-width="4" stroke-linecap="round" style="fill:none;stroke:var(--kontur)"/>
    <g stroke-width="4" stroke-linejoin="round" style="stroke:var(--kontur)">
      <polygon points="80,128 130,134 100,176" style="fill:var(--rosa)"/>
      <polygon points="390,152 440,146 418,192" style="fill:var(--primaer)"/>
      <polygon points="740,120 790,126 760,168" style="fill:var(--rosa)"/>
      <polygon points="1060,134 1110,128 1086,176" style="fill:var(--holz)"/>
    </g>
    <path d="M0 520 Q300 400 620 470 T1200 440 V800 H0 Z" stroke-width="5" stroke-linejoin="round" style="fill:var(--wiese);stroke:var(--kontur)"/>
    <g stroke-width="5" stroke-linejoin="round" style="stroke:var(--kontur)">
      <rect x="40" y="430" width="34" height="100" rx="8" style="fill:var(--stamm)"/>
      <circle cx="57" cy="400" r="80" style="fill:var(--krone)"/>
      <rect x="1140" y="400" width="30" height="90" rx="8" style="fill:var(--stamm)"/>
      <circle cx="1155" cy="372" r="68" style="fill:var(--krone)"/>
    </g>
  </svg>

  <main class="seite">
    <section class="karte" aria-labelledby="titel">
      <p class="hinweis">Entwurf – Demo</p>
      <h1 id="titel">Säulen-Werkstatt</h1>
      <p class="auftrag" id="auftrag">Stapel die Kästchen um, bis alle Säulen gleich hoch sind.</p>
      <div class="knopfreihe">
        <button type="button" id="vorlesen" aria-label="Auftrag vorlesen"><span aria-hidden="true">🔊</span> Vorlesen</button>
        <button type="button" id="neu">Neu starten</button>
      </div>
      <p class="rueck" id="rueck" role="status">Tippe auf eine Säule. Dann nimmst du ihr oberstes Kästchen hoch.</p>
      <p class="zaehler" id="zaehler" hidden>Kästchen insgesamt: 64 · Kinder: 4</p>
      <button type="button" class="btn-tipp" id="tippknopf">Tipp</button>
      <ul class="tipps" id="tipps" aria-live="polite"></ul>
    </section>

    <section class="karte" aria-labelledby="w-titel">
      <h2 id="w-titel" style="position:absolute;left:-9999px">Werkstatt</h2>
      <div class="leiste">
        <div class="seg" id="modusgruppe" role="group" aria-label="Was möchtest du tun?" hidden>
          <button type="button" id="m-stapeln" aria-pressed="true">Umstapeln</button>
          <button type="button" id="m-vergleichen" aria-pressed="false">Vergleichen</button>
        </div>
        <div class="seg" role="group" aria-label="Ansicht">
          <button type="button" id="a-becher" aria-pressed="false">Becher</button>
          <button type="button" id="a-saeulen" aria-pressed="true">Säulen</button>
        </div>
      </div>
      <div id="flaeche"></div>
      <div class="unten" id="unten"></div>
    </section>
  </main>
  <script>
    // Demo nur für den Entwurf. Die echte Logik baut später der Entwickler (mit Tests).
    (function () {
      var NAMEN = ["Marla", "Andi", "Hakan", "Francy"];
      var START = [15, 17, 12, 20];
      var MAX = 20;
      var werte = START.slice();
      var hand = null;          // Nummer der Säule, aus der ein Kästchen aufgenommen wurde
      var vgl = [];             // zwei gewählte Säulen für die Waage
      var modus = "stapeln";    // "stapeln" | "vergleichen"
      var ansicht = "saeulen";  // "saeulen" | "becher"
      var zeigeLinie = false;
      var gestapelt = false;    // wurde schon einmal umgestapelt? Erst dann gibt es "Vergleichen"
      var AUFTRAG = "Stapel die Kästchen um, bis alle Säulen gleich hoch sind.";
      function summe() { return werte.reduce(function (s, w) { return s + w; }, 0); }
      function mittel() { return summe() / werte.length; }
      function zahl(x) { return String(Math.round(x * 100) / 100).replace(".", ","); }

      var $ = function (id) { return document.getElementById(id); };
      var flaeche = $("flaeche"), unten = $("unten"), rueck = $("rueck");

      function sagen(t) { rueck.textContent = t; }
      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }
      function alleGleich() { return werte.every(function (w) { return w === werte[0]; }); }

      /* ---------- Tippen auf eine Säule ---------- */
      function tippeSaeule(i) {
        if (modus === "vergleichen") { waehle(i); return; }
        if (hand === null) {
          if (werte[i] === 0) { sagen(NAMEN[i] + " hat kein Kästchen. Von hier kann ich nichts nehmen."); return; }
          hand = i;
          sagen("Kästchen aufgenommen. Tippe auf eine andere Säule.");
        } else if (hand === i) {
          hand = null;
          sagen("Kästchen zurückgelegt. Tippe eine Säule an, um ein Kästchen zu nehmen.");
        } else if (werte[i] >= MAX) {
          sagen(NAMEN[i] + " ist voll (" + MAX + " Kästchen). Hier passt nichts mehr drauf. Probier eine andere Säule.");
        } else {
          werte[hand]--; werte[i]++;
          var von = hand; hand = null;
          gestapelt = true;
          if (alleGleich()) {
            sagen("Alle Säulen sind gleich hoch! Jedes Kind hat " + zahl(werte[0]) + " Kästchen. " +
              summe() + " Kästchen geteilt durch " + werte.length + " Kinder sind " + zahl(mittel()) + ".");
          } else {
            sagen("Gut! " + NAMEN[von] + " hat jetzt weniger. Welche Säule ist jetzt am höchsten?");
          }
        }
        render();
      }

      function waehle(i) {
        var p = vgl.indexOf(i);
        if (p >= 0) vgl.splice(p, 1);
        else { if (vgl.length === 2) vgl.shift(); vgl.push(i); }
        render();
      }

      /* ---------- Zeichnen ---------- */
      function zeichneSaeulen() {
        var plot = el("div", "plot");
        var achse = el("div", "achse");
        achse.appendChild(el("div", "ml", "ml"));
        [0, 5, 10, 15, 20].forEach(function (v) {
          var s = el("span", null, String(v)); s.style.setProperty("--v", v); achse.appendChild(s);
        });
        var feld = el("div", "feld");
        var gitter = el("div", "gitter");
        [0, 5, 10, 15, 20].forEach(function (v) {
          var l = el("i", v === 0 ? "null" : null); l.style.setProperty("--v", v); gitter.appendChild(l);
        });
        feld.appendChild(gitter);
        if (zeigeLinie) {
          var li = el("div", "linie"); li.style.setProperty("--v", mittel());
          li.appendChild(el("b", null, "Ausgleichslinie " + zahl(mittel())));
          feld.appendChild(li);
        }
        var spalten = el("div", "spalten");
        werte.forEach(function (w, i) {
          var b = el("button", "saeule"); b.type = "button"; b.dataset.i = i;
          var gewaehlt = modus === "stapeln" ? hand === i : vgl.indexOf(i) >= 0;
          b.setAttribute("aria-pressed", gewaehlt ? "true" : "false");
          var label = NAMEN[i] + ": " + w + " Kästchen";
          if (modus === "stapeln" && hand === i) label += ", oberstes Kästchen aufgenommen";
          if (modus === "vergleichen" && gewaehlt) label += ", für die Waage gewählt";
          b.setAttribute("aria-label", label);
          var st = el("div", "stapel");
          for (var k = 0; k < w; k++) {
            var c = el("div", "k");
            if (hand === i && k === w - 1) c.classList.add("hand");
            st.appendChild(c);
          }
          b.appendChild(st);
          var nm = el("div", "name");
          nm.appendChild(el("span", null, NAMEN[i]));
          var tm = el("span", "tm", "🦄"); tm.setAttribute("aria-hidden", "true"); nm.appendChild(tm);
          if (modus === "vergleichen" && gewaehlt) nm.appendChild(el("span", "ab", vgl.indexOf(i) === 0 ? "links" : "rechts"));
          b.appendChild(nm);
          b.addEventListener("click", function () { tippeSaeule(i); });
          spalten.appendChild(b);
        });
        feld.appendChild(spalten);
        plot.appendChild(achse); plot.appendChild(feld);
        flaeche.appendChild(plot);
      }

      function zeichneBecher() {
        var reihe = el("div", "bechers");
        werte.forEach(function (w, i) {
          var fig = el("figure", "becher");
          var y = 80 - 3.5 * w;
          var ticks = "";
          for (var m = 1; m <= 19; m++) {
            var ty = 80 - 3.5 * m, tx = 6 + 6 * (ty - 10) / 70, fuenf = m % 5 === 0;
            ticks += '<line x1="' + tx + '" y1="' + ty + '" x2="' + (tx + (fuenf ? 12 : 6)) + '" y2="' + ty +
              '" stroke-width="' + (fuenf ? 2 : 1) + '" style="stroke:var(--kontur)"/>';
          }
          fig.innerHTML = '<svg viewBox="0 0 60 90" aria-hidden="true" focusable="false">' +
            '<rect x="0" y="' + y + '" width="60" height="' + (3.5 * w + 3) + '" clip-path="url(#becherform)" style="fill:var(--wasser)"/>' +
            '<line x1="0" y1="' + y + '" x2="60" y2="' + y + '" stroke-width="3" clip-path="url(#becherform)" style="stroke:var(--wasser-rand)"/>' +
            ticks +
            '<path d="M6 10 H54 L48 80 H12 Z" stroke-width="3" stroke-linejoin="round" style="fill:none;stroke:var(--kontur)"/></svg>';
          fig.appendChild(el("figcaption", null, NAMEN[i] + " · " + w + " ml"));
          reihe.appendChild(fig);
        });
        flaeche.appendChild(reihe);
      }

      function waageSvg(a, b) {
        // a, b: Indizes oder null. Neigung nur zur Anzeige.
        // Nur drei feste Zustände: gerade, links tiefer, rechts tiefer (fester Winkel 10 Grad).
        // Die Seite mit der HÖHEREN Säule sinkt (y wächst nach unten).
        var neigung = 0;                       // +1: linke Seite sinkt, -1: rechte Seite sinkt
        if (a !== null && b !== null) {
          if (werte[a] > werte[b]) neigung = 1; else if (werte[a] < werte[b]) neigung = -1;
        }
        var cx = 150, cy = 36, L = 100, dy = neigung * L * Math.sin(10 * Math.PI / 180);
        var dx = L * Math.cos(neigung === 0 ? 0 : 10 * Math.PI / 180);
        var x1 = cx - dx, y1 = cy + dy;        // linkes Ende
        var x2 = cx + dx, y2 = cy - dy;        // rechtes Ende
        function schale(x, y, idx) {
          var txt = idx === null ? "?" : NAMEN[idx] + " " + werte[idx];
          return '<line x1="' + x + '" y1="' + y + '" x2="' + x + '" y2="' + (y + 22) + '" stroke-width="3" style="stroke:var(--kontur)"/>' +
            '<rect x="' + (x - 44) + '" y="' + (y + 22) + '" width="88" height="30" rx="9" stroke-width="3" style="fill:var(--karte);stroke:var(--kontur)"/>' +
            '<text x="' + x + '" y="' + (y + 42) + '" text-anchor="middle" font-size="14" font-weight="800" style="fill:var(--text)">' + txt + '</text>';
        }
        return '<svg class="waage" viewBox="0 0 300 130" aria-hidden="true" focusable="false">' +
          '<polygon points="150,36 118,124 182,124" stroke-width="4" stroke-linejoin="round" style="fill:var(--holz);stroke:var(--kontur)"/>' +
          '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke-width="12" stroke-linecap="round" style="stroke:var(--kontur)"/>' +
          '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke-width="6" stroke-linecap="round" style="stroke:var(--holz)"/>' +
          '<circle cx="150" cy="36" r="8" stroke-width="3" style="fill:var(--karte);stroke:var(--kontur)"/>' +
          schale(x1, y1, a) + schale(x2, y2, b) + '</svg>';
      }

      function zeichneUnten() {
        unten.innerHTML = "";
        var t = el("p", "t");
        if (ansicht === "becher") {
          t.textContent = "So viel Wasser ist jetzt in den Bechern. 1 Kästchen ist 1 ml. Zum Umstapeln wechsle zu „Säulen“.";
        } else if (modus === "stapeln") {
          t.textContent = "Erst die Säule antippen, von der du ein Kästchen nimmst, dann die Säule, auf die es kommt.";
        } else {
          var a = vgl.length > 0 ? vgl[0] : null, b = vgl.length > 1 ? vgl[1] : null;
          unten.innerHTML = waageSvg(a, b);
          var s = el("strong");
          if (a === null || b === null) s.textContent = "Tippe zwei Säulen an.";
          else if (werte[a] === werte[b]) s.textContent = "Gerade! Diese zwei sind gleich hoch. Prüfe auch die anderen.";
          else s.textContent = "Diese zwei sind nicht gleich hoch.";
          t.appendChild(s);
          t.appendChild(document.createTextNode("Die Waage zeigt nur, ob zwei Säulen gleich hoch sind."));
        }
        unten.appendChild(t);
      }

      function render() {
        var aktiv = document.activeElement;
        var merke = aktiv && aktiv.classList && aktiv.classList.contains("saeule") ? aktiv.dataset.i : null;
        flaeche.innerHTML = "";
        if (ansicht === "becher") zeichneBecher(); else zeichneSaeulen();
        zeichneUnten();
        $("m-stapeln").setAttribute("aria-pressed", modus === "stapeln");
        $("m-vergleichen").setAttribute("aria-pressed", modus === "vergleichen");
        $("a-becher").setAttribute("aria-pressed", ansicht === "becher");
        $("a-saeulen").setAttribute("aria-pressed", ansicht === "saeulen");
        $("m-stapeln").disabled = $("m-vergleichen").disabled = ansicht === "becher";
        $("modusgruppe").hidden = !gestapelt;
        $("auftrag").textContent = (modus === "vergleichen" && ansicht === "saeulen") ? "Prüfe zwei Säulen mit der Waage." : AUFTRAG;
        $("zaehler").textContent = "Kästchen insgesamt: " + summe() + " · Kinder: " + werte.length;
        if (merke !== null) {
          var neu = flaeche.querySelector('.saeule[data-i="' + merke + '"]');
          if (neu) neu.focus();
        }
      }

      /* ---------- Umschalter und Knöpfe ---------- */
      $("m-stapeln").addEventListener("click", function () {
        if (modus === "stapeln") return;   // schon aktiv: nichts ändern (Hand bleibt konsistent)
        modus = "stapeln"; vgl = [];
        sagen("Tippe auf eine Säule. Dann nimmst du ihr oberstes Kästchen hoch.");
        render();
      });
      $("m-vergleichen").addEventListener("click", function () {
        if (modus === "vergleichen") return;
        var hatteHand = hand !== null;
        modus = "vergleichen"; hand = null;
        sagen((hatteHand ? "Das Kästchen liegt wieder auf seiner Säule. " : "") + "Tippe zwei Säulen an. Die Waage vergleicht sie.");
        render();
      });
      $("a-becher").addEventListener("click", function () {
        if (ansicht === "becher") return;
        var hatteHand = hand !== null;
        ansicht = "becher"; hand = null; vgl = [];
        sagen((hatteHand ? "Das Kästchen liegt wieder auf seiner Säule. " : "") + "So viel Wasser ist jetzt in den Bechern.");
        render();
      });
      $("a-saeulen").addEventListener("click", function () {
        if (ansicht === "saeulen") return;
        ansicht = "saeulen";
        sagen("Das sind dieselben Mengen, nur als Säulen aus Kästchen.");
        render();
      });
      $("neu").addEventListener("click", function () {
        werte = START.slice(); hand = null; vgl = [];
        modus = "stapeln"; ansicht = "saeulen"; gestapelt = false; zeigeLinie = false;
        n = 0; liste.innerHTML = ""; $("zaehler").hidden = true;
        tk.textContent = "Tipp"; tk.disabled = false;
        sagen("Neu gestartet. Stapel die Kästchen um, bis alle Säulen gleich hoch sind.");
        render();
      });
      $("vorlesen").addEventListener("click", function () {
        sagen("Vorlesen gibt es in der fertigen Version. Hier ist es nur eine Attrappe.");
      });

      /* ---------- Gestufte Tipps ---------- */
      var tipps = [
        "Such einen Wert zwischen den hohen und den niedrigen Säulen.",
        "Nimm das oberste Kästchen der höchsten Säule und leg es auf die niedrigste. Wiederhole das.",
        "Verteile die Kästchen gerecht auf alle Kinder. Der Zähler oben hilft dir.",
        "Die gestrichelte Linie zeigt die Höhe, die am Ende alle Säulen haben."
      ];
      var n = 0, tk = $("tippknopf"), liste = $("tipps");
      tk.addEventListener("click", function () {
        if (n >= tipps.length) return;
        var wechsel = ansicht === "becher" || modus === "vergleichen";
        if (wechsel) {   // Tipps verweisen auf Säulen: dorthin wechseln
          var hatteAnsicht = ansicht === "becher";
          ansicht = "saeulen"; modus = "stapeln"; vgl = [];
          sagen(hatteAnsicht ? "Ich zeige dir wieder die Säulen. Dort passt der Tipp." : "Zurück zum Umstapeln. Dort passt der Tipp.");
        }
        var li = el("li"), b = el("b", null, "Tipp " + (n + 1) + ": ");
        li.appendChild(b); li.appendChild(document.createTextNode(tipps[n]));
        liste.appendChild(li);
        if (n === 2) $("zaehler").hidden = false;
        if (n === 3) zeigeLinie = true;
        render();
        n++;
        if (n >= tipps.length) { tk.textContent = "Keine Tipps mehr"; tk.disabled = true; }
        else tk.textContent = "Noch ein Tipp";
      });

      render();
    })();
  </script>
</body>
</html>
